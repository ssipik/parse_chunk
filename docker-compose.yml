# One-off runs: docker compose run --rm pipeline python -m rag_parse_chunk --batch-id <id>
services:
  pipeline:
    build: .
    # command: python -m rag_parse_chunk --batch-id all-20260728T135105Z
    command: tail -f /dev/null
    volumes:
      # live-mount code + config over the image copies (edit without rebuild)
      - ./src:/app
      - ./config:/app/config
      - ../data:/app/data
      - ./.vscode:/app/.vscode
    env_file:
      - path: .env
        required: false
    environment:
      # overrides .env: host.docker.internal = the host machine, where ../postgres publishes 5433
      RAG_PG_DSN: postgresql+psycopg://rag:rag@host.docker.internal:5433/rag_ingestion
